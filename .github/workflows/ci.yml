name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Build
        run: npm run build

  dist-in-sync:
    # The action is consumed straight from this repo, so GitHub runs the
    # committed packages/action/dist bundle - not src. If dist drifts from src,
    # every consumer silently keeps running the stale build. This is the single
    # most common way a JavaScript Action breaks, so it is enforced, not trusted.
    name: Committed dist matches src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Fail if rebuilding changed the committed bundle
        run: |
          if ! git diff --quiet -- packages/action/dist; then
            echo "::error::packages/action/dist is stale. Run 'npm run build' and commit the result."
            git diff --stat -- packages/action/dist
            exit 1
          fi
          echo "dist is up to date with src."

  action-loads:
    # A bundle that builds is still not a bundle that runs: a missing runtime
    # dep or a bad ncc externals config only shows up on require().
    name: Action bundle loads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require the built bundle
        env:
          # @actions/core reads inputs from INPUT_<NAME>, uppercased with dashes
          # kept. Supplying them keeps the action from emitting its own
          # ::error:: annotation, which would show as a red mark on a green job.
          INPUT_NVIDIA-API-KEY: dummy-key-for-load-check
          INPUT_GITHUB-TOKEN: dummy-token-for-load-check
        run: |
          # Workflow commands printed by the bundle are neutralised for the
          # duration of this step so its log output cannot annotate the job.
          echo "::stop-commands::loadcheck"
          node -e "
            try {
              require('./packages/action/dist/index.js');
              console.log('bundle loaded');
            } catch (e) {
              if (/Cannot find module|SyntaxError|Unexpected token/.test(String(e))) {
                console.error('BUNDLE_LOAD_FAILED', e);
                process.exit(1);
              }
              console.log('bundle loaded (threw on missing Actions context, which is expected)');
            }
          "
          status=$?
          echo "::loadcheck::"
          exit $status

  api-image:
    # This job is why the Dockerfile was rewritten: the old one did
    # `COPY dist/ ./dist/` against a gitignored build output, so the image had
    # never actually been buildable from a clean checkout.
    name: API image builds and starts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibesafe
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          push: false
          load: true
          tags: vibesafe-api:ci

      - name: The image must actually start and serve
        # Building an image is not evidence that it runs. The API needs Postgres
        # and Redis, so both are provided above rather than weakening the check.
        run: |
          docker run -d --name api --network host \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/vibesafe \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e JWT_SECRET=ci-placeholder-jwt-secret \
            -e NVIDIA_API_KEY=nvapi-ci-placeholder \
            -e GITHUB_CLIENT_ID=ci-placeholder \
            -e GITHUB_CLIENT_SECRET=ci-placeholder \
            -e GITHUB_WEBHOOK_SECRET=ci-placeholder \
            -e API_URL=http://127.0.0.1:3001 \
            -e WEB_URL=http://127.0.0.1:3000 \
            vibesafe-api:ci

          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Status}}' api)
            [ "$state" = "exited" ] && break
            curl -sf -o /dev/null http://127.0.0.1:3001/ && break
            sleep 2
          done

          docker logs api
          state=$(docker inspect -f '{{.State.Status}}' api)
          echo "container state: $state"
          if [ "$state" = "exited" ]; then
            code=$(docker inspect -f '{{.State.ExitCode}}' api)
            echo "::error::API container exited with code $code"
            exit 1
          fi
          echo "API container is running."
